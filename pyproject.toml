[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-demo"
version = "0.1.0"
description = "A small, well-tested Retrieval-Augmented Generation app with a provider-agnostic design."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # >=0.0.18 fixes a denial-of-service (CVE-2024-53981) in multipart parsing.
    "python-multipart>=0.0.18",
    "uvicorn>=0.34",
    # We embed Chroma as a PersistentClient (never the network server), so the
    # unpatched pre-auth RCE in the Chroma FastAPI server (CVE-2026-45829) does
    # not apply to this app.
    "chromadb>=1.0",
    "openai>=1.99",
    "pypdf>=5.0",
    # Imported directly (rag.api, rag.config); declared explicitly rather than
    # relying on it arriving transitively via fastapi/pydantic-settings.
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "fakeredis>=2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "tests" is on the path so the relocated test doubles (tests/doubles) import as
# a top-level ``doubles`` package; the product is the HTTP API (no CLI script).
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
