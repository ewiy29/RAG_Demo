[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-demo"
version = "0.1.0"
description = "A small, well-tested Retrieval-Augmented Generation app with a provider-agnostic design."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "chromadb>=0.5",
    "openai>=1.40",
    "pypdf>=4.2",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "fakeredis>=2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "tests" is on the path so the relocated test doubles (tests/doubles) import as
# a top-level ``doubles`` package; the product is the HTTP API (no CLI script).
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
